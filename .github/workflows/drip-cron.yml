# Processes Day 7 drip once contacts are within Brevo's 3-day schedule window.
# Requires repo secret CRON_SECRET (same value as Railway CRON_SECRET).
name: Drip Day7 cron

on:
  schedule:
    - cron: "20 * * * *" # hourly
  workflow_dispatch:

concurrency:
  group: drip-day7-cron
  cancel-in-progress: true

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process Day 7 queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skip"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "accept: application/json" \
            "https://rakhuno.com/api/cron/drip"
